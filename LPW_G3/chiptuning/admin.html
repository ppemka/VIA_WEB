-<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chip Tuning Admin</title>
    <link rel='stylesheet' type='text/css' href='css/admin.css'>
</head>
<body>
    <div class="container">
        <h1>Chip Tuning Database</h1>
        
        <div style="margin-bottom: 20px;">
            <a href="index.html" class="btn" style="text-decoration: none; background: #6c757d;">← Home</a>
            <button id="addBtn" class="btn">Add New Entry</button>
        </div>
        
        <div id="alertContainer"></div>
        
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Brand</th>
                    <th>Model</th>
                    <th>Year</th>
                    <th>Engine</th>
                    <th>ECU</th>
                    <th>Original HP</th>
                    <th>Stage 1 HP</th>
                    <th>Stage 2 HP</th>
                    <th>Original Torque</th>
                    <th>Stage 1 Torque</th>
                    <th>Stage 2 Torque</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="chipData">
                <tr>
                    <td colspan="13">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Modal -->
    <div id="chipModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Add Entry</h2>
            
            <div id="modalAlert"></div>
            
            <form id="chipForm">
                <input type="hidden" id="chipId">
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="brand">Brand:</label>
                        <input type="text" id="brand" required>
                    </div>
                    <div class="form-group">
                        <label for="model">Model:</label>
                        <input type="text" id="model" required>
                    </div>
                    <div class="form-group">
                        <label for="year">Year:</label>
                        <input type="number" id="year" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="engine">Engine:</label>
                        <input type="text" id="engine" required>
                    </div>
                    <div class="form-group">
                        <label for="ecu">ECU:</label>
                        <input type="text" id="ecu" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="originalHp">Original HP:</label>
                        <input type="number" id="originalHp">
                    </div>
                    <div class="form-group">
                        <label for="stage1Hp">Stage 1 HP:</label>
                        <input type="number" id="stage1Hp">
                    </div>
                    <div class="form-group">
                        <label for="stage2Hp">Stage 2 HP:</label>
                        <input type="number" id="stage2Hp">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="originalTorque">Original Torque:</label>
                        <input type="number" id="originalTorque">
                    </div>
                    <div class="form-group">
                        <label for="stage1Torque">Stage 1 Torque:</label>
                        <input type="number" id="stage1Torque">
                    </div>
                    <div class="form-group">
                        <label for="stage2Torque">Stage 2 Torque:</label>
                        <input type="number" id="stage2Torque">
                    </div>
                </div>
                
                <button type="submit" class="btn">Save</button>
                <button type="button" class="btn" onclick="closeModal()">Cancel</button>
            </form>
        </div>
    </div>
</body>
    <script src="js/admin_script.js"></script>
</html>
